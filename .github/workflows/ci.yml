name: Monorepo CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      contract: ${{ steps.filter.outputs.contract }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - ".github/workflows/**"
              - "package.json"
              - "package-lock.json"
              - ".npmrc"
              - "scripts/**"
              - "README.md"
            contract:
              - "kk-agent-contract/**"
            backend:
              - "kk-agent-backend/**"
            frontend:
              - "kk-agent-frontend/**"
            desktop:
              - "kk-agent-desktop/**"

  contract:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace kk-agent-contract run build
      - run: npm --workspace kk-agent-contract run lint

  backend:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@krischan-klug"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm --workspace kk-agent-backend run build
      - run: npm --workspace kk-agent-backend run test

  frontend:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@krischan-klug"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm --workspace kk-agent-frontend run build

  desktop:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@krischan-klug"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run desktop:build
