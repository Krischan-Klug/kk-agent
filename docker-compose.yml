version: '3.8'

services:
  kk-agent-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kk-agent-frontend
    restart: unless-stopped
    ports:
      - '3002:3000'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKEND_API_URL=http://host.docker.internal:3001
      - PORT=3000
