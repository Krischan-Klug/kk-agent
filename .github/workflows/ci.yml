name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-desktop:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: kk-agent-desktop
      - uses: actions/checkout@v4
        with:
          repository: Krischan-Klug/kk-agent-backend
          path: kk-agent-backend
      - uses: actions/checkout@v4
        with:
          repository: Krischan-Klug/kk-agent-frontend
          path: kk-agent-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            kk-agent-desktop/package-lock.json
            kk-agent-backend/package-lock.json
            kk-agent-frontend/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@krischan-klug"
      - run: npm install
        working-directory: kk-agent-desktop
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install
        working-directory: kk-agent-backend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install
        working-directory: kk-agent-frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build:desktop
        working-directory: kk-agent-backend
      - run: npm run build:desktop
        working-directory: kk-agent-frontend
      - run: npm run build
        working-directory: kk-agent-desktop
